[project]
name = "hag-build-signing-manager"
version = "1.0.0"
description = "Hot Attic Games Build & Signing Manager"
requires-python = ">=3.11"
dependencies = [
    "PySide6>=6.7",
    "cryptography>=42",
]

[project.optional-dependencies]
test = ["pytest>=8"]
build = ["pyinstaller>=6.10"]

[project.gui-scripts]
hag-bsm = "hag_bsm.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
