name: Android build

on:
  pull_request:
    paths:
      - "android/**"
      - "src/hag_bsm/**"
      - "tools/**"
      - ".github/workflows/android-build.yml"
  push:
    branches: [main]
    paths:
      - "android/**"
      - "src/hag_bsm/**"
      - "tools/**"
      - ".github/workflows/android-build.yml"
  workflow_dispatch:

concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    working-directory: android

jobs:
  test-and-package:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: gradle/actions/setup-gradle@v4

      - name: Prepare parity fixtures (Windows app code + keytool)
        working-directory: .
        run: |
          python -m pip install cryptography==50.0.1
          python tools/parity_fixtures.py "$RUNNER_TEMP/parity"

      - name: Build a minimal unsigned APK with aapt2 (for signature tests)
        run: |
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          PLATFORM=$(ls -d "$ANDROID_HOME"/platforms/android-* | sort -V | tail -1)
          cat > "$RUNNER_TEMP/AndroidManifest.xml" <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android"
              package="com.hotatticgames.citest" android:versionCode="1" android:versionName="1.0">
              <uses-sdk android:minSdkVersion="24" android:targetSdkVersion="34" />
              <application android:hasCode="false" android:label="CI Test" />
          </manifest>
          EOF
          "$BT/aapt2" link -o "$RUNNER_TEMP/unsigned.apk" -I "$PLATFORM/android.jar" --manifest "$RUNNER_TEMP/AndroidManifest.xml"
          echo "APKSIGNER=$BT/apksigner" >> "$GITHUB_ENV"

      - name: Unit tests, parity tests and debug APK
        env:
          HAGBSM_PARITY_DIR: ${{ runner.temp }}/parity
          HAGBSM_PARITY_REQUIRED: "1"
          HAGBSM_TEST_UNSIGNED_APK: ${{ runner.temp }}/unsigned.apk
        run: ./gradlew --no-daemon :core:test :apk:test :app:testDebugUnitTest :app:assembleDebug

      - name: Reverse parity check (Windows app + keytool read Android output)
        working-directory: .
        run: python tools/check_parity.py "$RUNNER_TEMP/parity"

      - name: Verify APK signature
        run: |
          APK=app/build/outputs/apk/debug/app-debug.apk
          "$APKSIGNER" verify --print-certs "$APK"
          mkdir -p ../dist
          cp "$APK" ../dist/HotAtticBuildSigningManager-1.0.0-debug.apk
          ls -l ../dist

      - name: Upload private test APK
        uses: actions/upload-artifact@v4
        with:
          name: HotAtticBuildSigningManager-android-debug-${{ github.sha }}
          path: dist/HotAtticBuildSigningManager-1.0.0-debug.apk
          retention-days: 30
          if-no-files-found: error

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: android-test-reports
          path: android/**/build/reports/tests/
          retention-days: 7

  emulator-smoke-test:
    needs: test-and-package
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Enable KVM
        working-directory: .
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Install and run on an Android 14 emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: true
          working-directory: android
          script: ./gradlew --no-daemon :app:connectedDebugAndroidTest

      - name: Upload instrumentation reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-device-test-reports
          path: android/app/build/reports/androidTests/
          retention-days: 7
          if-no-files-found: ignore
