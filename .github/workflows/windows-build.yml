name: Windows build

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: windows-build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test-and-package:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      # keytool for signing tests; the runner's Android SDK provides apksigner and aapt2.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Show signing tools
        run: |
          echo "JAVA_HOME=$env:JAVA_HOME"
          echo "ANDROID_HOME=$env:ANDROID_HOME"
          Get-ChildItem "$env:ANDROID_HOME\build-tools" | Select-Object -Last 3

      - name: Run tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest -v -rs

      - name: Build executable
        run: |
          python packaging/make_icon.py
          pyinstaller --noconfirm --clean packaging/hag_bsm.spec

      - name: Smoke test executable
        run: |
          $result = Join-Path $env:RUNNER_TEMP "selftest.txt"
          $p = Start-Process -FilePath "dist\HotAtticBuildSigningManager.exe" -ArgumentList "--self-test", "`"$result`"" -Wait -PassThru
          Get-Content $result
          if ($p.ExitCode -ne 0) { throw "Self-test failed with exit code $($p.ExitCode)" }
          if (-not (Select-String -Path $result -Pattern "^PASS" -Quiet)) { throw "Self-test did not report PASS" }
          Get-Item dist\HotAtticBuildSigningManager.exe | Select-Object Name, Length

      - name: Upload private test build
        uses: actions/upload-artifact@v4
        with:
          name: HotAtticBuildSigningManager-windows-${{ github.sha }}
          path: dist/HotAtticBuildSigningManager.exe
          retention-days: 30
          if-no-files-found: error
